<div class="ca-studio-panel" id="caStudioPanel">
    <p class="ca-studio-panel-desc">Viết bài SEO chuẩn SaaS — brief, outline, AI writing, tối ưu on-page và xuất bản WordPress.</p>
    <div class="ca-usage-panel" id="caUsagePanel">
        <div class="ca-usage-panel-head">
            <div class="ca-usage-plan">Gói: <strong id="caUsagePlanName">—</strong> · <span id="caUsageMonth">—</span></div>
            <button type="button" class="ca-usage-upgrade" data-digiseo-pricing-open>Nâng cấp gói</button>
        </div>
        <div class="ca-usage-warn-banner" id="caUsageWarnBanner" hidden></div>
        <div class="ca-usage-grid" id="caUsageGrid">
            <div class="ca-usage-item" data-feature="content_ai_article">
                <div class="ca-usage-item-label">AI Articles</div>
                <div class="ca-usage-item-val" id="caUsageArticles">—</div>
                <div class="ca-usage-bar"><div class="ca-usage-bar-fill" id="caUsageArticlesBar" style="width:0%"></div></div>
            </div>
            <div class="ca-usage-item" data-feature="content_ai_brief">
                <div class="ca-usage-item-label">Content Briefs</div>
                <div class="ca-usage-item-val" id="caUsageBriefs">—</div>
                <div class="ca-usage-bar"><div class="ca-usage-bar-fill" id="caUsageBriefsBar" style="width:0%"></div></div>
            </div>
            <div class="ca-usage-item" data-feature="image_generate">
                <div class="ca-usage-item-label">AI Images</div>
                <div class="ca-usage-item-val" id="caUsageImages">—</div>
                <div class="ca-usage-bar"><div class="ca-usage-bar-fill" id="caUsageImagesBar" style="width:0%"></div></div>
            </div>
            <div class="ca-usage-item" data-feature="content_ai_bulk_article">
                <div class="ca-usage-item-label">Bulk Jobs</div>
                <div class="ca-usage-item-val" id="caUsageBulk">—</div>
                <div class="ca-usage-bar"><div class="ca-usage-bar-fill" id="caUsageBulkBar" style="width:0%"></div></div>
            </div>
            <div class="ca-usage-item" data-feature="wp_publish">
                <div class="ca-usage-item-label">WordPress Publish</div>
                <div class="ca-usage-item-val" id="caUsagePublish">—</div>
                <div class="ca-usage-bar"><div class="ca-usage-bar-fill" id="caUsagePublishBar" style="width:0%"></div></div>
            </div>
        </div>
    </div>
</div>
