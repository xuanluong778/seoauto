<div class="ca-inline-step-section" data-ca-inline-section="outline" id="contentAiOutlineSection">
    <div class="field-head"><label for="competitorUrl">Link đối thủ (tham khảo outline)</label></div>
    <div class="upload-row">
        <input id="competitorUrl" type="url" placeholder="https://domain-doi-thu.com/bai-viet" />
        <button class="btn secondary" type="button" id="btnOutlineReference">Outline tham khảo</button>
    </div>
    <div class="hint" id="hint-competitor"></div>
    <div class="field-head"><label for="outlineContent">Outline content</label></div>
    <div class="outline-tools">
        <input id="replaceFrom" type="text" placeholder="Từ cần thay (vd: Vua Web Digi)" />
        <input id="replaceTo" type="text" placeholder="Thay bằng (vd: Thế Giới Digi)" />
        <button class="btn secondary" type="button" id="btnReplaceAll">Replace All</button>
        <button class="btn secondary" type="button" id="btnRefreshOutline">Làm mới Outline</button>
    </div>
    <div class="hint" id="hint-outline-actions"></div>
    <textarea id="outlineContent" style="min-height:120px;"></textarea>
    <div class="outline-bottom-actions">
        <button type="button" class="ai-btn" data-field="outline_content">Gợi ý AI</button>
    </div>
    <div class="hint" id="hint-outline_content"></div>
</div>
