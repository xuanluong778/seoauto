<div class="ca-seo-autofix-overlay" id="caSeoAutofixOverlay" hidden aria-hidden="true">
    <div class="ca-seo-autofix-backdrop" id="caSeoAutofixBackdrop" aria-hidden="true"></div>
    <div class="ca-seo-autofix-dialog" id="caSeoAutofixDiff" role="dialog" aria-modal="true" aria-labelledby="caSeoAutofixDiffTitle">
        <div class="ca-seo-autofix-diff-head">
            <div class="ca-seo-autofix-diff-head-main">
                <h2 id="caSeoAutofixDiffTitle">Xem trước thay đổi SEO</h2>
                <span class="ca-seo-autofix-delta" id="caSeoAutofixDelta"></span>
            </div>
            <button type="button" class="mini-btn ca-seo-autofix-close" id="btnSeoAutofixClose" aria-label="Đóng">✕</button>
        </div>
        <p class="ca-seo-autofix-summary" id="caSeoAutofixSummary"></p>
        <p class="ca-seo-autofix-warn" id="caSeoAutofixMarkupWarn" hidden></p>
        <div class="ca-seo-autofix-diff-body" id="caSeoAutofixDiffBody"></div>
        <div class="ca-seo-autofix-diff-actions">
            <button type="button" class="btn" id="btnSeoAutofixApply">Áp dụng thay đổi</button>
            <button type="button" class="btn ghost" id="btnSeoAutofixCancel">Hủy</button>
        </div>
    </div>
</div>
