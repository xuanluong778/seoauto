{# Chatbot AI — Tab Chat (mặc định) + workflow tabs #}
<div id="digiseoChatbotRoot" class="digiseo-chatbot-root" aria-hidden="true">
    <div class="digiseo-chatbot-panel" id="digiseoChatbotPanel" role="dialog" aria-labelledby="digiseoChatbotTitle" aria-modal="false">
        <header class="digiseo-chatbot-head">
            <img class="digiseo-chatbot-avatar" src="/static/img/digiseo-chatbot-avatar.png" width="40" height="40" alt="" aria-hidden="true">
            <div class="digiseo-chatbot-head-text">
                <strong id="digiseoChatbotTitle">Chatbot AI</strong>
                <span class="digiseo-chatbot-status"><span class="digiseo-chatbot-status-dot" aria-hidden="true"></span> Seoauto Assistant</span>
            </div>
            <button type="button" class="digiseo-chatbot-close" id="digiseoChatbotClose" aria-label="Đóng">×</button>
        </header>

        <nav class="gcb-tabs" id="gcbTabs" role="tablist" aria-label="Chatbot AI tabs"></nav>

        <div class="gcb-body" id="gcbBody">
            <div class="gcb-workspace">
                <div class="gcb-guest" id="gcbGuest" hidden>
                    <p>Vui lòng <a href="/login">đăng nhập</a> để chạy workflow AI. Tab <strong>Chat</strong> vẫn dùng được để hỏi FAQ.</p>
                </div>
                <div class="gcb-panels" id="gcbPanels"></div>
            </div>
        </div>

        <footer class="digiseo-chatbot-foot" id="digiseoChatbotFoot" hidden>
            <button type="button" class="digiseo-chatbot-mic" id="digiseoChatbotMic" title="Ghi âm giọng nói" aria-label="Ghi âm giọng nói" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
            </button>
            <textarea class="digiseo-chatbot-input" id="digiseoChatbotInput" rows="1" placeholder="Nhập câu hỏi…" maxlength="4000" aria-label="Tin nhắn chatbot"></textarea>
            <button type="button" class="digiseo-chatbot-send" id="digiseoChatbotSend" aria-label="Gửi">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
            </button>
        </footer>
    </div>
    <div class="digiseo-chatbot-fab-row">
        <div class="digiseo-inbox-notify" id="digiseoInboxNotify" hidden>
            <button type="button" class="digiseo-inbox-backdrop" id="digiseoInboxBackdrop" hidden tabindex="-1" aria-hidden="true"></button>
            <button type="button" class="digiseo-inbox-fab" id="digiseoInboxFab" aria-label="Tin nhắn Chatbot CSKH" title="Tin nhắn Chatbot CSKH" aria-expanded="false" aria-controls="digiseoInboxDropdown">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                </svg>
                <span class="digiseo-inbox-badge" id="digiseoInboxBadge" hidden>0</span>
            </button>
            <div class="digiseo-inbox-dropdown" id="digiseoInboxDropdown" hidden role="dialog" aria-label="Tin nhắn Chatbot mới" aria-modal="true">
                <div class="digiseo-inbox-dropdown-head">Tin nhắn mới</div>
                <div class="digiseo-inbox-dropdown-list" id="digiseoInboxList">
                    <p class="digiseo-inbox-empty">Chưa có tin nhắn mới.</p>
                </div>
            </div>
        </div>
        <button type="button" class="digiseo-chatbot-fab" id="digiseoChatbotFab" aria-label="Mở Chatbot AI" title="Chatbot AI">
            <img src="/static/img/digiseo-chatbot-avatar.png" width="56" height="56" alt="">
        </button>
    </div>
</div>
